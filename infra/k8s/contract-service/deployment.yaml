apiVersion: apps/v1
kind: Deployment
metadata:
  name: contract-service
  namespace: skillmatch
  labels:
    app: contract-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contract-service
  template:
    metadata:
      labels:
        app: contract-service
    spec:
      containers:
        - name: contract-service
          image: ghcr.io/aandrioli62/skillmatch/contract-service:latest
          ports:
            - containerPort: 8083
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              value: contractdb
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: skillmatch-config
                  key: rabbitmq-host
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: KEYCLOAK_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: skillmatch-config
                  key: keycloak-issuer-uri
            - name: KEYCLOAK_JWK_URI
              valueFrom:
                configMapKeyRef:
                  name: skillmatch-config
                  key: keycloak-jwk-uri
            - name: USER_SERVICE_BASE_URL
              value: "http://user-service:8081"
            - name: JAVA_OPTS
              value: "-Xmx256m -Xms128m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 45
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: contract-service
  namespace: skillmatch
spec:
  selector:
    app: contract-service
  ports:
    - port: 8083
      targetPort: 8083
  type: ClusterIP
