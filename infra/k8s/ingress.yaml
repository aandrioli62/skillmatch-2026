# Exposes the frontend, API Gateway and Keycloak on the Oracle VM's public IP
# via nip.io (no real domain needed — <anything>.<IP>.nip.io resolves to <IP>).
# Uses Traefik, which K3s installs by default (IngressClass "traefik") — no
# separate Ingress Controller to install.
#
# HTTP only for now, no TLS/cert-manager: getting the app reachable end to end
# was the priority given the deadline. To add HTTPS later, install cert-manager,
# uncomment the ClusterIssuer below, and add a `tls:` block per host:
#   helm upgrade --install cert-manager cert-manager \
#     --repo https://charts.jetstack.io --namespace cert-manager --create-namespace --set installCRDs=true
#
# ---
# apiVersion: cert-manager.io/v1
# kind: ClusterIssuer
# metadata:
#   name: letsencrypt-prod
# spec:
#   acme:
#     server: https://acme-v02.api.letsencrypt.org/directory
#     email: YOUR_EMAIL@example.com
#     privateKeySecretRef:
#       name: letsencrypt-prod-account-key
#     solvers:
#       - http01:
#           ingress:
#             ingressClassName: traefik

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skillmatch-ingress
  namespace: skillmatch
spec:
  ingressClassName: traefik
  rules:
    - host: 92.4.167.195.nip.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
    - host: keycloak.92.4.167.195.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8180
