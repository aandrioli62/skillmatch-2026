# Before applying:
#   1. Replace YOUR_DOMAIN.example.com below with a real DNS name pointing at
#      the Oracle VM's public IP. No domain yet? A free option is nip.io:
#      point it at "<VM_PUBLIC_IP>.nip.io" (e.g. 132.145.10.4.nip.io) — no
#      registrar needed, and Let's Encrypt's HTTP-01 challenge works with it.
#   2. Replace YOUR_EMAIL@example.com with the address Let's Encrypt should
#      use for expiry/revocation notices.
#   3. Requires the Nginx Ingress Controller and cert-manager installed by
#      infra/scripts/setup-oracle-vm.sh.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: YOUR_EMAIL@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skillmatch-ingress
  namespace: skillmatch
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - YOUR_DOMAIN.example.com
      secretName: skillmatch-tls
  rules:
    - host: YOUR_DOMAIN.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          # Uncomment once the frontend (Phase 7) is deployed as "frontend-service":
          # - path: /
          #   pathType: Prefix
          #   backend:
          #     service:
          #       name: frontend-service
          #       port:
          #         number: 80
