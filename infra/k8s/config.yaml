# Shared config/secrets for all SkillMatch services (namespace: skillmatch).
#
# NOTE on Keycloak URIs: issuer-uri must match what the browser actually gets
# tokens from (the public ingress host, since that's what Keycloak stamps into
# the JWT "iss" claim per KC_HOSTNAME in keycloak/deployment.yaml) — it's a
# string comparison only, no network call. jwk-uri fetches signing keys, a
# real network call, so it stays on the in-cluster Service name. Same split
# already used locally in infra/docker-compose.yml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: skillmatch-config
  namespace: skillmatch
data:
  keycloak-issuer-uri: "https://keycloak.92.4.167.195.nip.io/realms/skillmatch"
  keycloak-jwk-uri: "http://keycloak:8180/realms/skillmatch/protocol/openid-connect/certs"
  rabbitmq-host: "rabbitmq"
  mongo-host: "mongodb"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: skillmatch
type: Opaque
stringData:
  username: skillmatch
  password: secret
---
apiVersion: v1
kind: Secret
metadata:
  name: mongo-credentials
  namespace: skillmatch
type: Opaque
stringData:
  username: skillmatch
  password: secret
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: skillmatch
type: Opaque
stringData:
  username: guest
  password: guest
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin-credentials
  namespace: skillmatch
type: Opaque
stringData:
  username: admin
  password: admin
