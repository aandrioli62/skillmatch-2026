# Static build served by Nginx. No env vars at runtime — the Vite build already
# baked in the public Keycloak/API URLs (see frontend/Dockerfile build args).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: skillmatch
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/aandrioli62/skillmatch/frontend:latest
          ports:
            - containerPort: 80
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 80
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 80
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 80
            periodSeconds: 5
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: skillmatch
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
