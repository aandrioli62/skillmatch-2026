# Route *_HOST defaults in application.yml already match the k8s Service names
# below (user-service, project-service, ...), so only Keycloak needs overriding.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: skillmatch
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/aandrioli62/skillmatch/api-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: KEYCLOAK_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: skillmatch-config
                  key: keycloak-issuer-uri
            - name: KEYCLOAK_JWK_URI
              valueFrom:
                configMapKeyRef:
                  name: skillmatch-config
                  key: keycloak-jwk-uri
            - name: CORS_ALLOWED_ORIGINS
              value: "https://92.4.167.195.nip.io"
            - name: JAVA_OPTS
              value: "-Xmx256m -Xms128m"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: skillmatch
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
