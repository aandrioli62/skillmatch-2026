spring:
  application:
    name: notification-service
  data:
    mongodb:
      uri: mongodb://${MONGO_USERNAME:skillmatch}:${MONGO_PASSWORD:secret}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:notificationdb}?authSource=admin
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/skillmatch}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8180/realms/skillmatch/protocol/openid-connect/certs}
      client:
        registration:
          user-service:
            provider: keycloak
            client-id: ${NOTIFICATION_SERVICE_CLIENT_ID:notification-service}
            client-secret: ${NOTIFICATION_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/skillmatch/protocol/openid-connect/token}
  mail:
    host: ${SMTP_HOST:smtp-relay.brevo.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

notification:
  mail:
    from-address: ${SMTP_FROM:}
    from-display-name: ${SMTP_FROM_DISPLAY_NAME:SkillMatch}

server:
  port: ${SERVER_PORT:8086}

services:
  user-service:
    base-url: ${USER_SERVICE_BASE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
  packages-to-scan: com.skillmatch.notificationservice

logging:
  structured:
    format:
      console: json

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.skillmatch: DEBUG
    org.springframework.security: DEBUG

springdoc:
  swagger-ui:
    try-it-out-enabled: true
